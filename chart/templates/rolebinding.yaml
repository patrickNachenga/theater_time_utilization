{{- if eq .Values.role.enabled true -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: 
  name: {{ include "registration.serviceAccountName" . }}
roleRef: 
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "registration.serviceAccountName" . }}
subjects: 
  - 
    kind: ServiceAccount
    name: {{ required "Service account should be created!" (include "registration.serviceAccountName" .) }}
{{- end }}
