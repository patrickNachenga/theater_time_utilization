services:

  # ── Theatre Time Utilization Service ──────────────────────────────────
  mnh-theatre-time:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mnh-theatre-time
    restart: unless-stopped
    env_file:
      - ./src/core/.env
    ports:
      - '8095:8095'
    networks:
      - mnh-network
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8095 --reload"

volumes:
  postgres_data:

networks:
  mnh-network:
    driver: bridge
    external: true
